name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize, and publish
    runs-on: macos-26

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing and notarization credentials
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          required_secrets=(
            BUILD_CERTIFICATE_BASE64
            P12_PASSWORD
            APP_STORE_CONNECT_API_KEY_BASE64
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
          )
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing required GitHub secret: $secret_name"
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/holo-developer-id.p12"
          keychain_path="$RUNNER_TEMP/holo-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          api_key_directory="$RUNNER_TEMP/holo-notary-key"
          api_key_path="$api_key_directory/AuthKey.p8"

          mkdir -p "$api_key_directory"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 >/dev/null
          security list-keychains -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null

          identity_output="$(security find-identity -v -p codesigning "$keychain_path")"
          signing_identity="$(awk -F '"' '/Developer ID Application/{print $2; exit}' <<< "$identity_output")"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::The imported certificate is not a Developer ID Application identity"
            exit 1
          fi

          team_id="$(sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p' <<< "$signing_identity")"
          if [[ -z "$team_id" ]]; then
            echo "::error::Could not derive the Apple team ID from the signing identity"
            exit 1
          fi

          {
            printf 'DEVELOPER_ID_APPLICATION=%s\n' "$signing_identity"
            printf 'DEVELOPMENT_TEAM=%s\n' "$team_id"
            printf 'APP_STORE_CONNECT_API_KEY_PATH=%s\n' "$api_key_path"
            printf 'APP_STORE_CONNECT_KEY_ID=%s\n' "$APP_STORE_CONNECT_KEY_ID"
            printf 'APP_STORE_CONNECT_ISSUER_ID=%s\n' "$APP_STORE_CONNECT_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build and notarize the DMG
        shell: bash
        run: |
          set -euo pipefail
          safe_tag="${GITHUB_REF_NAME//\//-}"
          dmg_path="$GITHUB_WORKSPACE/dist/Holo-$safe_tag.dmg"
          DMG_PATH="$dmg_path" scripts/release.sh
          printf 'DMG_PATH=%s\n' "$dmg_path" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$DMG_PATH" \
            --verify-tag \
            --generate-notes \
            --title "Holo $GITHUB_REF_NAME"

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/holo-developer-id.p12"
          rm -rf "$RUNNER_TEMP/holo-notary-key"
          security delete-keychain "$RUNNER_TEMP/holo-signing.keychain-db" 2>/dev/null || true
