name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: >
          xcodebuild
          -project Holo.xcodeproj
          -scheme Holo
          -configuration Debug
          -derivedDataPath /tmp/HoloDerived
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Unit test
        run: >
          xcodebuild
          -project Holo.xcodeproj
          -scheme Holo
          -configuration Debug
          -derivedDataPath /tmp/HoloDerived
          CODE_SIGNING_ALLOWED=NO
          test
