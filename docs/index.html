<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Holo turns the desk around your MacBook into four acoustic tap zones.">
  <meta name="color-scheme" content="light dark">
  <title>Holo — Tap your desk. Your Mac responds.</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #fbfbfd;
      --text: #1d1d1f;
      --secondary: #65656a;
      --accent: #0066cc;
      --accent-hover: #0055b3;
      --page-width: 1120px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0f0f10;
        --text: #f5f5f7;
        --secondary: #aaaab0;
        --accent: #2997ff;
        --accent-hover: #57acff;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      display: grid;
      min-height: 100svh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      grid-template-rows: auto minmax(0, 1fr) auto;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-underline-offset: 0.18em;
      text-decoration-thickness: 1px;
    }

    a:hover {
      color: var(--accent-hover);
    }

    a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 4px;
    }

    .site-header,
    footer {
      width: min(calc(100% - 40px), var(--page-width));
      margin-inline: auto;
    }

    main {
      width: 100%;
      min-height: 0;
    }

    .site-header {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      color: var(--text);
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 15px;
    }

    nav a {
      color: var(--secondary);
      text-decoration: none;
    }

    nav a:hover {
      color: var(--text);
    }

    .hero {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      min-height: 0;
      align-content: center;
      justify-items: center;
      overflow: hidden;
      padding: clamp(44px, 7vh, 88px) 20px;
      text-align: center;
      isolation: isolate;
    }

    .hero-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0.3;
      pointer-events: none;
    }

    .hero::after {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(circle at 50% 48%, rgb(251 251 253 / 34%) 0%, rgb(251 251 253 / 68%) 56%, var(--background) 92%);
      content: "";
      pointer-events: none;
    }

    .hero > :not(.hero-canvas, .filter-defs) {
      position: relative;
      z-index: 2;
    }

    .filter-defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    @media (prefers-color-scheme: dark) {
      .hero-canvas {
        opacity: 0.52;
      }

      .hero::after {
        background: radial-gradient(circle at 50% 48%, rgb(15 15 16 / 18%) 0%, rgb(15 15 16 / 58%) 58%, var(--background) 92%);
      }
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(64px, 10vw, 112px);
      font-weight: 700;
      letter-spacing: -0.065em;
      line-height: 0.9;
    }

    .hero .pitch {
      max-width: 820px;
      margin: 34px 0 0;
      font-size: clamp(32px, 5.4vw, 64px);
      font-weight: 630;
      letter-spacing: -0.045em;
      line-height: 1.05;
    }

    .hero .intro {
      max-width: 650px;
      margin: 28px 0 0;
      color: var(--secondary);
      font-size: clamp(18px, 2vw, 22px);
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-top: 42px;
    }

    .button {
      position: relative;
      display: inline-flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0 26px;
      border: 1px solid rgb(255 255 255 / 32%);
      border-radius: 999px;
      background: rgb(0 70 145 / 46%);
      box-shadow:
        inset 2px 2px 1px rgba(255, 255, 255, 0.5),
        inset -2px -2px 1px rgba(255, 255, 255, 0.16),
        0 12px 32px rgb(0 0 0 / 24%),
        0 2px 8px rgb(0 102 204 / 18%);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 480ms, padding-inline 480ms, background-color 320ms, box-shadow 320ms;
      transition-timing-function: cubic-bezier(0.175, 0.885, 0.32, 2.2);
      isolation: isolate;
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      backdrop-filter: blur(18px) saturate(140%);
    }

    .button::before {
      position: absolute;
      inset: -2px;
      z-index: 0;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.16);
      content: "";
      pointer-events: none;
    }

    .button span {
      position: relative;
      z-index: 1;
    }

    .button:hover {
      padding-inline: 30px;
      border-color: rgb(255 255 255 / 42%);
      background: rgb(0 83 170 / 52%);
      box-shadow:
        inset 2px 2px 1px rgba(255, 255, 255, 0.58),
        inset -2px -2px 1px rgba(255, 255, 255, 0.2),
        0 16px 38px rgb(0 0 0 / 28%),
        0 4px 12px rgb(0 102 204 / 24%);
      color: #fff;
      transform: scale(1.035);
    }

    .text-link {
      font-size: 16px;
      font-weight: 550;
    }

    @supports (filter: url("#glass-distortion")) {
      .button::before {
        filter: url("#glass-distortion");
      }
    }

    footer {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      color: var(--secondary);
      font-size: 14px;
    }

    footer p {
      margin: 0;
    }

    @media (max-width: 760px) {
      .site-header,
      footer {
        width: min(calc(100% - 32px), var(--page-width));
      }

      .site-header {
        min-height: 62px;
      }

      .hero {
        padding: 20px 16px;
      }

      .hero h1 {
        font-size: clamp(58px, 22vw, 84px);
      }

      .hero .pitch {
        margin-top: 20px;
        font-size: clamp(38px, 11vw, 54px);
      }

      .hero .intro {
        margin-top: 18px;
        font-size: 17px;
      }

      .actions {
        flex-direction: column;
        gap: 14px;
        width: 100%;
        margin-top: 24px;
      }

      .button {
        width: 100%;
      }

      footer {
        min-height: 62px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#main" aria-label="Holo home">Holo</a>
    <nav aria-label="Primary navigation">
      <a href="https://github.com/JustinGamer191/Holo">GitHub</a>
    </nav>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <canvas class="hero-canvas" aria-hidden="true"></canvas>
      <svg class="filter-defs" aria-hidden="true" focusable="false">
        <defs>
          <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
      </svg>
      <h1 id="hero-title">Holo</h1>
      <p class="pitch">Tap your desk.<br>Your Mac responds.</p>
      <p class="intro">A native macOS utility that turns the space around your MacBook into four acoustic tap zones.</p>
      <div class="actions">
        <a class="button" href="https://github.com/JustinGamer191/Holo/releases/latest"><span>Download latest release</span></a>
        <a class="text-link" href="https://github.com/JustinGamer191/Holo">View on GitHub&nbsp;↗</a>
      </div>
    </section>
  </main>

  <footer>
    <p>Holo · Native macOS acoustic tap zones</p>
    <a href="https://github.com/JustinGamer191/Holo">GitHub&nbsp;↗</a>
  </footer>

  <script>
    (() => {
      const hero = document.querySelector(".hero");
      const canvas = hero?.querySelector(".hero-canvas");
      if (!hero || !canvas) return;

      let gl;
      try {
        gl = canvas.getContext("webgl", {
          alpha: true, antialias: true, depth: true, powerPreference: "low-power"
        });
      } catch (_) {
        return;
      }
      if (!gl) return;

      const vertexSource = `
        precision highp float;
        attribute vec3 aPosition;
        uniform float uAspect, uTime;
        varying vec3 vNormal, vWorldPosition;

        vec3 mod289(vec3 x) { return x - floor(x / 289.0) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x / 289.0) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

        float snoise(vec3 v) {
          const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
          const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
          vec3 i = floor(v + dot(v, C.yyy));
          vec3 x0 = v - i + dot(i, C.xxx);
          vec3 g = step(x0.yzx, x0.xyz);
          vec3 l = 1.0 - g;
          vec3 i1 = min(g.xyz, l.zxy);
          vec3 i2 = max(g.xyz, l.zxy);
          vec3 x1 = x0 - i1 + C.xxx;
          vec3 x2 = x0 - i2 + C.yyy;
          vec3 x3 = x0 - D.yyy;
          i = mod289(i);
          vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
            + i.y + vec4(0.0, i1.y, i2.y, 1.0))
            + i.x + vec4(0.0, i1.x, i2.x, 1.0));
          float n = 1.0 / 7.0;
          vec3 ns = n * D.wyz - D.xzx;
          vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
          vec4 x_ = floor(j * ns.z);
          vec4 y_ = floor(j - 7.0 * x_);
          vec4 x = x_ * ns.x + ns.yyyy;
          vec4 y = y_ * ns.x + ns.yyyy;
          vec4 h = 1.0 - abs(x) - abs(y);
          vec4 b0 = vec4(x.xy, y.xy);
          vec4 b1 = vec4(x.zw, y.zw);
          vec4 s0 = floor(b0) * 2.0 + 1.0;
          vec4 s1 = floor(b1) * 2.0 + 1.0;
          vec4 sh = -step(h, vec4(0.0));
          vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
          vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
          vec3 p0 = vec3(a0.xy, h.x);
          vec3 p1 = vec3(a0.zw, h.y);
          vec3 p2 = vec3(a1.xy, h.z);
          vec3 p3 = vec3(a1.zw, h.w);
          vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1),
            dot(p2, p2), dot(p3, p3)));
          p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
          vec4 m = max(0.6 - vec4(
            dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)
          ), 0.0);
          m *= m;
          return 42.0 * dot(m * m, vec4(
            dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)
          ));
        }

        mat3 rotateX(float angle) {
          float c = cos(angle), s = sin(angle);
          return mat3(1.0, 0.0, 0.0, 0.0, c, s, 0.0, -s, c);
        }
        mat3 rotateY(float angle) {
          float c = cos(angle), s = sin(angle);
          return mat3(c, 0.0, -s, 0.0, 1.0, 0.0, s, 0.0, c);
        }
        void main() {
          vec3 normal = normalize(aPosition);
          float displacement = snoise(aPosition * 2.0 + vec3(uTime * 0.5)) * 0.2;
          vec3 displaced = aPosition + normal * displacement;
          mat3 rotation = rotateX(0.3 + sin(uTime * 0.11) * 0.08)
            * rotateY(uTime * 0.09);
          vec3 worldPosition = rotation * displaced * 1.55;
          vec3 viewPosition = worldPosition - vec3(0.0, 0.0, 4.8);
          float near = 0.1, far = 100.0, focalLength = 2.15;
          vNormal = normalize(rotation * normal);
          vWorldPosition = worldPosition;
          gl_Position = vec4(
            viewPosition.x * focalLength / uAspect,
            viewPosition.y * focalLength,
            ((far + near) / (near - far)) * viewPosition.z
              + (2.0 * far * near) / (near - far),
            -viewPosition.z
          );
        }
      `;

      const fragmentSource = `
        precision mediump float;
        uniform vec3 uColor, uLightPosition;
        varying vec3 vNormal, vWorldPosition;
        void main() {
          vec3 normal = normalize(vNormal);
          vec3 lightDirection = normalize(uLightPosition - vWorldPosition);
          vec3 viewDirection = normalize(vec3(0.0, 0.0, 4.8) - vWorldPosition);
          float diffuse = max(dot(normal, lightDirection), 0.0);
          float fresnel = pow(1.0 - dot(normal, viewDirection), 2.0) * 0.5;
          vec3 color = uColor * (0.4 + diffuse * 0.65 + fresnel);
          gl_FragColor = vec4(color, 0.88);
        }
      `;

      const compile = (type, source) => {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          gl.deleteShader(shader);
          return null;
        }
        return shader;
      };

      const vertexShader = compile(gl.VERTEX_SHADER, vertexSource);
      const fragmentShader = compile(gl.FRAGMENT_SHADER, fragmentSource);
      if (!vertexShader || !fragmentShader) {
        canvas.remove(); return;
      }

      const program = gl.createProgram();
      gl.attachShader(program, vertexShader); gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);
      gl.deleteShader(vertexShader); gl.deleteShader(fragmentShader);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        gl.deleteProgram(program); canvas.remove(); return;
      }

      const createIcosphere = (subdivisions) => {
        const t = (1 + Math.sqrt(5)) / 2;
        const vertices = [
          [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
          [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
          [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]
        ];
        let faces = [
          [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
          [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
          [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
          [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
        ];
        const normalize = (point) => {
          const length = Math.hypot(...point);
          return point.map((value) => value / length);
        };
        for (let i = 0; i < vertices.length; i++) vertices[i] = normalize(vertices[i]);
        for (let level = 0; level < subdivisions; level++) {
          const cache = new Map();
          const midpoint = (a, b) => {
            const key = a < b ? `${a}:${b}` : `${b}:${a}`;
            if (cache.has(key)) return cache.get(key);
            const point = normalize(vertices[a].map((value, axis) =>
              (value + vertices[b][axis]) * 0.5));
            const index = vertices.push(point) - 1;
            cache.set(key, index); return index;
          };
          const nextFaces = [];
          for (const [a, b, c] of faces) {
            const ab = midpoint(a, b), bc = midpoint(b, c), ca = midpoint(c, a);
            nextFaces.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]);
          }
          faces = nextFaces;
        }
        const edges = [];
        const seen = new Set();
        const addEdge = (a, b) => {
          const low = Math.min(a, b), high = Math.max(a, b);
          const key = low * 65536 + high;
          if (seen.has(key)) return;
          seen.add(key); edges.push(low, high);
        };
        for (const [a, b, c] of faces) {
          addEdge(a, b); addEdge(b, c); addEdge(c, a);
        }
        return { positions: new Float32Array(vertices.flat()), indices: new Uint16Array(edges) };
      };

      const geometry = createIcosphere(innerWidth < 700 ? 4 : 5);
      const positionBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, geometry.positions, gl.STATIC_DRAW);
      const indexBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, geometry.indices, gl.STATIC_DRAW);
      gl.useProgram(program);
      const positionLocation = gl.getAttribLocation(program, "aPosition");
      gl.enableVertexAttribArray(positionLocation);
      gl.vertexAttribPointer(positionLocation, 3, gl.FLOAT, false, 0, 0);

      const uniforms = {
        aspect: gl.getUniformLocation(program, "uAspect"),
        time: gl.getUniformLocation(program, "uTime"),
        color: gl.getUniformLocation(program, "uColor"),
        light: gl.getUniformLocation(program, "uLightPosition")
      };
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LEQUAL);
      gl.clearColor(0, 0, 0, 0);

      const motionQuery = matchMedia("(prefers-reduced-motion: reduce)");
      const darkQuery = matchMedia("(prefers-color-scheme: dark)");
      const usePointer = matchMedia("(hover: hover) and (pointer: fine)").matches;
      const targetLight = [0, 0.8];
      const light = [0, 0.8, 3.4];
      let reducedMotion = motionQuery.matches;
      let elapsed = 0, lastFrame = performance.now(), frameRequest = 0, inView = true;

      const resize = () => {
        const bounds = hero.getBoundingClientRect();
        const pixelRatio = Math.min(devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.round(bounds.width * pixelRatio));
        const height = Math.max(1, Math.round(bounds.height * pixelRatio));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          gl.viewport(0, 0, width, height);
        }
        render(elapsed);
      };

      const render = (time) => {
        if (!usePointer) {
          targetLight[0] = Math.sin(time * 0.31) * 2.4;
          targetLight[1] = Math.cos(time * 0.23) * 1.35;
        }
        light[0] += (targetLight[0] - light[0]) * 0.06;
        light[1] += (targetLight[1] - light[1]) * 0.06;
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.uniform1f(uniforms.aspect, canvas.width / canvas.height);
        gl.uniform1f(uniforms.time, time);
        gl.uniform3fv(uniforms.color, darkQuery.matches ? [0.18, 0.58, 1.0] : [0.02, 0.38, 0.72]);
        gl.uniform3fv(uniforms.light, light);
        gl.drawElements(gl.LINES, geometry.indices.length, gl.UNSIGNED_SHORT, 0);
      };

      const stop = () => {
        if (!frameRequest) return;
        cancelAnimationFrame(frameRequest); frameRequest = 0;
      };

      const frame = (now) => {
        frameRequest = 0;
        if (reducedMotion || document.hidden || !inView) return;
        elapsed += Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now; render(elapsed);
        frameRequest = requestAnimationFrame(frame);
      };

      const start = () => {
        if (reducedMotion || document.hidden || !inView || frameRequest) return;
        lastFrame = performance.now(); frameRequest = requestAnimationFrame(frame);
      };

      if (usePointer) {
        hero.addEventListener("pointermove", (event) => {
          const bounds = hero.getBoundingClientRect();
          targetLight[0] = ((event.clientX - bounds.left) / bounds.width * 2 - 1) * 2.8;
          targetLight[1] = (1 - (event.clientY - bounds.top) / bounds.height * 2) * 2.0;
        }, { passive: true });
        hero.addEventListener("pointerleave", () => {
          targetLight[0] = 0; targetLight[1] = 0.8;
        }, { passive: true });
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stop();
        else start();
      });
      motionQuery.addEventListener("change", (event) => {
        reducedMotion = event.matches;
        stop(); render(elapsed); start();
      });
      darkQuery.addEventListener("change", () => render(elapsed));

      addEventListener("resize", resize, { passive: true });
      if ("ResizeObserver" in window) new ResizeObserver(resize).observe(hero);

      if ("IntersectionObserver" in window) {
        new IntersectionObserver(([entry]) => {
          inView = entry.isIntersecting;
          if (inView) start(); else stop();
        }).observe(hero);
      }

      resize();
      if (!reducedMotion) start();
    })();
  </script>
</body>
</html>
